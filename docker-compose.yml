services:
  mongo:
    image: mongo:7
    container_name: queueforge-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: queueforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: queueforge-api
    restart: unless-stopped
    command: ["node", "src/index.js"]
    environment:
      PORT: 4000
      MONGO_URL: mongodb://mongo:27017/queueforge
      REDIS_URL: redis://redis:6379
      OUTPUT_DIR: /app/output
    volumes:
      - job-output:/app/output
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: queueforge-worker
    restart: unless-stopped
    command: ["node", "src/queue/worker.js"]
    environment:
      MONGO_URL: mongodb://mongo:27017/queueforge
      REDIS_URL: redis://redis:6379
      OUTPUT_DIR: /app/output
    volumes:
      - job-output:/app/output
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    container_name: queueforge-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo-data:
  job-output:
